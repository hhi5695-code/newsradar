<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="코스피·코스닥 상한가를 테마로 모아 보는 상한가">
  <title>상한가</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101318'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23ff5a64' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23ff5a64'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <section id="gate" class="gate">
    <form id="unlock" class="gate-card">
      <span class="mark" aria-hidden="true"></span>
      <h1>상한가</h1>
      <p class="muted">암호는 이 브라우저 안에서만 쓰이며 서버로 전송되지 않습니다.</p>
      <label class="field" for="password">암호
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <label class="check"><input id="remember" type="checkbox"> 이 기기에 암호 기억</label>
      <button type="submit">열기</button>
      <p id="gate-msg" class="warn" hidden></p>
    </form>
  </section>
  <div id="shell" hidden>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>상한가</h1>
        <p id="updated" class="muted">시세를 불러오는 중</p>
      </div>
    </div>
  </header>
  <nav class="tabs" aria-label="메뉴">
    <button type="button" id="tab-today" class="on" data-view="today">오늘</button>
    <button type="button" id="tab-calendar" data-view="calendar">테마달력</button>
  </nav>
  <main id="app" class="app"></main>
  <div id="sheet" class="sheet" hidden></div>
  <div id="modal" class="modal" hidden></div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
